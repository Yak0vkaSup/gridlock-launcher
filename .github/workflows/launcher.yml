# Builds the launcher for Windows and Linux on GitHub-hosted runners and publishes a GitHub Release
# (installers + latest.json for the in-app updater). Trigger: push a tag launcher-v<version> that matches
# launcher/src-tauri/tauri.conf.json, or run it by hand.
name: Launcher

on:
  push:
    tags: ["launcher-v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: launcher/src-tauri

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: npm ci
        working-directory: launcher
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: launcher
          tagName: launcher-v__VERSION__
          releaseName: "GridLock Launcher v__VERSION__"
          releaseBody: "Windows: the -setup.exe. Linux: the .AppImage (chmod +x) or the .deb."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
